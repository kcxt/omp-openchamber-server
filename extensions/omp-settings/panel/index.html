<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>omp settings</title>
<style>
  :root { color-scheme: light dark; --bd: #8884; --mut: #888; --ok: #2a8a4a; --err: #c0392b; }
  html, body { background: transparent; }
  body { font: 13px/1.4 system-ui, sans-serif; margin: 0; }
  header { position: sticky; top: 0; z-index: 1; padding: 8px 10px; background: Canvas; border-bottom: 1px solid var(--bd); display: grid; gap: 6px; }
  header input[type=search] { width: 100%; box-sizing: border-box; padding: 5px 7px; font: inherit; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--mut); font-size: 12px; }
  main { padding: 4px 10px 40px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); margin: 18px 0 2px; }
  .row { display: grid; gap: 4px; padding: 8px 0; border-bottom: 1px solid var(--bd); }
  .key { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
  .desc { color: var(--mut); font-size: 11.5px; }
  .set { color: var(--ok); font-size: 11px; margin-left: 6px; }
  .ctl { display: flex; gap: 6px; align-items: flex-start; }
  .ctl input[type=text], .ctl input[type=number], .ctl textarea { flex: 1; min-width: 0; box-sizing: border-box; padding: 4px 6px; font: inherit; }
  .ctl textarea { font-family: ui-monospace, monospace; font-size: 11.5px; min-height: 56px; }
  .msg { font-size: 11.5px; min-height: 1em; }
  .msg.err { color: var(--err); } .msg.ok { color: var(--ok); }
  button { padding: 3px 8px; cursor: pointer; }
</style>
</head>
<body>
<header>
  <input id="q" type="search" placeholder="Filter settings">
  <div class="bar"><label><input id="setOnly" type="checkbox"> only ones I set</label><span id="status">loading…</span></div>
</header>
<main id="main"></main>
<script src="./main.js"></script>
</body>
</html>
